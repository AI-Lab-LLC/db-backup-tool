[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Same as the Forge worker (worker-876414): 3 processes, database queue.
[program:queue]
command=php /var/www/html/artisan queue:work database --sleep=3 --quiet --queue=default
user=www-data
environment=HOME="/var/www",USER="www-data"
numprocs=3
process_name=%(program_name)s_%(process_num)02d
autostart=%(ENV_RUN_QUEUE)s
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Forge ran `schedule:run` from cron every minute.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
environment=HOME="/var/www",USER="www-data"
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
